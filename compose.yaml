services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fasteat
      POSTGRES_PASSWORD: fasteat
      POSTGRES_DB: fasteat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasteat -d fasteat"]
      interval: 3s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
